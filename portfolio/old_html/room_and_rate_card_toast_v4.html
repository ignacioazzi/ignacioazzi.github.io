  .rc5 .card {

    margin-bottom: 8px;
  }

  .rc5 .toast-inline {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
  }

  .rc5 .toast-icon {

    border-radius: 50%;

    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .rc5 .toast-inline .toast-icon{
    width: 12px;
    height: 12px;
    background: transparent;
  }

  .rc5 .toast-icon svg {
    width: 10px;
    height: 10px;

  .rc5 .msg {
